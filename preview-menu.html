<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mots Secrets - Preview Menu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  @font-face {
    font-family: 'ShakeAlone';
    src: url('assets/fonts/ShakeAlone-YqLpj.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --beige: #E5DFC8;
    --dark: #1a1a1a;
    --gold: #8B6914;
    --gold-light: #B8860B;
    --text: #1a1a1a;
    --muted: #666666;
  }

  body {
    background: var(--beige);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  .bg-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #E5DFC8 0%, #DED3A8 25%, #E2D8B2 50%, #D9CFA6 75%, #E5DFC8 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .floating-words {
    position: absolute; inset: 0;
    overflow: hidden; pointer-events: none;
  }
  .floating-word {
    position: absolute;
    font-family: 'Bebas Neue', sans-serif;
    white-space: nowrap;
    animation: floatUp linear infinite;
    user-select: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(var(--word-rotate, 0deg)); opacity: 0; }
    2%   { opacity: 1; }
    98%  { opacity: 1; }
    100% { transform: translateY(-100px) rotate(var(--word-rotate, 0deg)); opacity: 0; }
  }

  .particles {
    position: absolute; inset: 0;
    overflow: hidden; pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--dark);
    border-radius: 50%; opacity: 0;
    animation: particleRise linear infinite;
  }
  @keyframes particleRise {
    0%   { transform: translateY(0) scale(0); opacity: 0; }
    15%  { opacity: 0.25; transform: scale(1); }
    85%  { opacity: 0.08; }
    100% { transform: translateY(-100vh) scale(0); opacity: 0; }
  }

  /* ─── LANGUE (haut gauche) ─── */
  .lang-btn {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 20;
    width: 42px; height: 30px;
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid rgba(0,0,0,0.2);
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .lang-btn:hover { transform: scale(1.1); box-shadow: 0 3px 10px rgba(0,0,0,0.25); }
  .lang-btn:active { transform: scale(0.95); }

  /* Drapeau France */
  .flag-fr, .flag-uk {
    position: absolute; inset: 0;
    transition: opacity 0.3s;
  }
  .flag-fr { background: linear-gradient(90deg, #002395 33.3%, #fff 33.3%, #fff 66.6%, #ED2939 66.6%); }
  .flag-uk { opacity: 0; background: #012169; }
  .flag-uk::before {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(45deg, transparent 40%, #fff 40%, #fff 43%, #C8102E 43%, #C8102E 57%, #fff 57%, #fff 60%, transparent 60%),
      linear-gradient(-45deg, transparent 40%, #fff 40%, #fff 43%, #C8102E 43%, #C8102E 57%, #fff 57%, #fff 60%, transparent 60%),
      linear-gradient(0deg, transparent 42%, #fff 42%, #fff 46%, #C8102E 46%, #C8102E 54%, #fff 54%, #fff 58%, transparent 58%),
      linear-gradient(90deg, transparent 42%, #fff 42%, #fff 46%, #C8102E 46%, #C8102E 54%, #fff 54%, #fff 58%, transparent 58%);
  }
  .lang-btn.uk .flag-fr { opacity: 0; }
  .lang-btn.uk .flag-uk { opacity: 1; }

  /* ─── BOUTONS DU BAS ─── */
  .bottom-bar {
    position: absolute;
    bottom: 20px; left: 0; right: 0;
    z-index: 10;
    display: flex; justify-content: center; gap: 12px;
    transition: opacity 0.4s, transform 0.4s;
  }
  .bottom-bar.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }
  .bottom-btn {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--dark);
    border: 1.5px solid #8B6914;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .bottom-btn svg { width: 20px; height: 20px; fill: #8B6914; opacity: 0.85; }
  .bottom-btn:hover { background: #2a2a2a; transform: scale(1.1); }
  .bottom-btn:hover svg { opacity: 1; }

  /* ─── TITLE ─── */
  .title-area {
    position: relative; z-index: 10;
    text-align: center; margin-top: 30px;
    transition: opacity 0.4s, transform 0.4s;
  }
  .title-area.hidden { opacity: 0; transform: translateY(-20px); }

  .title-row {
    display: flex;
    justify-content: center;
    gap: 0;
  }
  .title-letter {
    font-family: 'ShakeAlone', 'Bebas Neue', sans-serif;
    font-size: 72px;
    color: var(--dark);
    display: inline-block;
    min-width: 0.4em;
    text-align: center;
    animation: titleFlicker 5s ease-in-out infinite;
  }
  .title-space {
    display: inline-block;
    width: 14px;
  }

  @keyframes titleFlicker {
    0%, 85%, 100% { opacity: 1; }
    89%            { opacity: 0.6; }
    91%            { opacity: 1; }
    93%            { opacity: 0.6; }
    95%            { opacity: 1; }
  }

  .subtitle {
    font-family: 'Space Mono', monospace;
    font-size: 10px; color: var(--gold);
    letter-spacing: 4px; margin-top: 4px;
  }

  /* ─── SAFE ─── */
  .safe-area {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    margin-top: 30px;
    transition: opacity 0.5s, transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  }
  .safe-area.shrinking { opacity: 0; transform: scale(0.3); }

  .safe-scene {
    cursor: pointer;
    position: relative;
    width: 220px; height: 240px;
  }

  .safe-pulse {
    position: absolute;
    top: 55%; left: 50%;
    transform: translate(-50%, -50%);
    width: 240px; height: 280px;
    border-radius: 50%;
    border: 1px solid rgba(26,26,26,0.15);
    opacity: 0;
    animation: safePulse 3s ease-in-out infinite;
    pointer-events: none;
  }
  .safe-pulse:nth-child(2) { animation-delay: 1s; }
  .safe-pulse:nth-child(3) { animation-delay: 2s; }
  @keyframes safePulse {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0.12; }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }

  /* ── Corps principal du coffre ── */
  .safe {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 180px; height: 200px;
    border-radius: 10px 10px 4px 4px;
    background: #1a1a1a;
    border: 4px solid #8B6914;
    box-shadow:
      0 0 0 2px #111,
      0 8px 30px rgba(0,0,0,0.6),
      inset 0 0 0 2px #0a0a0a;
    transition: transform 0.2s ease;
  }
  .safe-scene:hover .safe {
    transform: translateX(-50%) scale(1.02);
  }

  /* Cadre intérieur */
  .safe-frame {
    position: absolute;
    inset: 6px;
    border-radius: 7px 7px 3px 3px;
    background: linear-gradient(180deg, #0d0d0d 0%, #131313 40%, #0a0a0a 100%);
    border: 2px solid #222;
    overflow: hidden;
  }

  /* Étagères */
  .safe-shelf {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #2a2a2a 10%, #333 50%, #2a2a2a 90%, transparent 100%);
  }
  .safe-shelf.top { top: 35%; }
  .safe-shelf.bottom { top: 65%; }

  /* Contenu visible */
  .safe-content {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 2;
  }
  .safe-content svg {
    width: 30px; height: 30px;
    fill: rgba(245,245,220,0.45);
  }
  .safe-content-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 10px; color: rgba(245,245,220,0.2);
    letter-spacing: 3px;
  }

  /* Petits éléments décoratifs */
  .safe-item {
    position: absolute;
    background: rgba(245,245,220,0.06);
    border-radius: 2px;
    z-index: 1;
  }
  .safe-item.b1 { top: 10%; left: 14%; width: 24px; height: 6px; }
  .safe-item.b2 { top: 14%; right: 14%; width: 16px; height: 4px; }
  .safe-item.b3 { top: 40%; left: 18%; width: 20px; height: 5px; }
  .safe-item.b4 { top: 42%; right: 14%; width: 10px; height: 10px; border-radius: 50%; }
  .safe-item.b5 { bottom: 22%; left: 12%; width: 18px; height: 5px; }
  .safe-item.b6 { bottom: 18%; right: 16%; width: 14px; height: 4px; }

  /* ── CADRAN (sur le coffre) ── */
  .safe-dial {
    position: absolute;
    top: 38%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    z-index: 5;
  }
  .safe-scene.turning .safe-dial {
    animation: crackCode 1.8s cubic-bezier(0.45, 0, 0.55, 1) forwards;
  }
  @keyframes crackCode {
    0%   { transform: translate(-50%, -50%) rotate(0deg); }
    30%  { transform: translate(-50%, -50%) rotate(180deg); }
    60%  { transform: translate(-50%, -50%) rotate(60deg); }
    85%  { transform: translate(-50%, -50%) rotate(360deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .safe-dial-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      #3d3d3d 0deg, #1f1f1f 15deg, #3d3d3d 30deg, #1f1f1f 45deg,
      #3d3d3d 60deg, #1f1f1f 75deg, #3d3d3d 90deg, #1f1f1f 105deg,
      #3d3d3d 120deg, #1f1f1f 135deg, #3d3d3d 150deg, #1f1f1f 165deg,
      #3d3d3d 180deg, #1f1f1f 195deg, #3d3d3d 210deg, #1f1f1f 225deg,
      #3d3d3d 240deg, #1f1f1f 255deg, #3d3d3d 270deg, #1f1f1f 285deg,
      #3d3d3d 300deg, #1f1f1f 315deg, #3d3d3d 330deg, #1f1f1f 345deg,
      #3d3d3d 360deg
    );
    border: 3px solid #8B6914;
    box-shadow:
      0 4px 16px rgba(0,0,0,0.5),
      inset 0 1px 2px rgba(255,255,255,0.05);
  }

  .safe-dial-marks {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
  }
  .safe-dial-mark {
    position: absolute;
    width: 2px; height: 7px;
    background: rgba(245,245,220,0.35);
    border-radius: 1px;
    top: 0; left: 50%;
    margin-left: -1px;
    transform-origin: 50% 400%;
  }

  .safe-dial-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 32px; height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle, #4a4a4a, #2a2a2a);
    border: 2px solid #8B6914;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .safe-dial-pointer {
    position: absolute;
    top: 7px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 10px;
    background: #8B6914;
    border-radius: 2px;
  }

  /* ── POIGNÉE (sous le cadran, à l'intérieur du coffre) ── */
  .safe-handle {
    position: absolute;
    top: 68%; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 16px;
    background: linear-gradient(180deg, #444, #333, #2a2a2a);
    border-radius: 4px;
    border: 2px solid #8B6914;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    z-index: 3;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .safe-handle::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #8B6914;
    border: 1px solid #B8860B;
  }
  .safe-scene.turning .safe-dial {
    transform: translate(-50%, -50%) rotate(360deg);
  }
  /* Poignée tourne APRES le déchiffrement */
  .safe-scene.turning .safe-handle {
    transform: translateX(-50%) rotate(90deg);
    transition-delay: 1.8s;
  }
  /* Léger effet d'ouverture quand la poignée tourne */
  .safe-scene.turning .safe {
    transform: translateX(-50%) scale(1.04);
    box-shadow:
      0 0 0 2px #111,
      0 8px 30px rgba(0,0,0,0.6),
      0 0 20px rgba(245,245,220,0.05),
      inset 0 0 0 2px #0a0a0a;
    transition: transform 0.5s ease 2.1s, box-shadow 0.5s ease 2.1s;
  }

  /* ── RIVETS ── */
  .safe-rivet {
    position: absolute;
    width: 7px; height: 7px;
    background: radial-gradient(circle, #B8860B, #8B6914);
    border-radius: 50%;
    border: 1px solid #8B6914;
    z-index: 2;
  }
  .safe-rivet.tl { top: 8px; left: 8px; }
  .safe-rivet.tr { top: 8px; right: 8px; }
  .safe-rivet.bl { bottom: 8px; left: 8px; }
  .safe-rivet.br { bottom: 8px; right: 8px; }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    transition: background 0.4s ease;
  }
  .modal-overlay.visible { background: rgba(0,0,0,0.5); pointer-events: auto; }

  .modal {
    width: 85%; max-width: 400px;
    background: var(--beige);
    border-radius: 20px;
    border: 2px solid #8B6914;
    padding: 20px;
    transform: scale(0) translateY(60px);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-overlay.visible .modal { transform: scale(1) translateY(0); opacity: 1; }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; color: var(--gold);
    letter-spacing: 2px; text-align: center; margin-bottom: 16px;
  }
  .modal-section { margin-bottom: 12px; }
  .modal-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px; color: #333; margin-bottom: 6px;
  }
  .mode-grid {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  .mode-card {
    width: 47%; background: var(--beige);
    border: 2px solid rgba(0,0,0,0.15);
    border-radius: 10px; padding: 10px 6px;
    text-align: center; cursor: pointer; transition: all 0.2s;
  }
  .mode-card:hover { background: rgba(0,0,0,0.06); }
  .mode-card.active { background: #8B6914; border-color: #8B6914; }
  .mode-card.active .mode-card-title { color: var(--beige); }
  .mode-card.active .mode-card-desc { color: rgba(245,245,220,0.7); }
  .mode-card-emoji { font-size: 28px; margin-bottom: 2px; }
  .mode-card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px; color: var(--dark); letter-spacing: 1px;
  }
  .mode-card-desc {
    font-family: 'Space Mono', monospace;
    font-size: 8px; color: #666; line-height: 1.3;
  }

  .slider-row {
    display: flex; align-items: center; gap: 12px; margin: 8px 0;
  }
  .slider-bar {
    flex: 1; height: 6px;
    background: rgba(0,0,0,0.12); border-radius: 3px;
    position: relative;
  }
  .slider-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: var(--dark); border-radius: 3px; width: 20%;
  }
  .slider-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; color: var(--dark);
    min-width: 30px; text-align: center;
  }

  .launch-btn {
    width: 100%; background: #8B6914;
    padding: 14px; border-radius: 15px;
    text-align: center; cursor: pointer; margin-top: 8px;
    transition: all 0.2s;
  }
  .launch-btn:hover { background: #2a2a2a; }
  .launch-btn-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; color: var(--beige); letter-spacing: 2px;
  }

  .close-btn {
    width: 100%; background: var(--dark);
    border: 1.5px solid #8B6914;
    padding: 12px; border-radius: 10px;
    text-align: center; cursor: pointer; margin-top: 10px;
  }
  .close-btn-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px; color: var(--beige); letter-spacing: 2px;
  }

  .bottom-hint {
    position: absolute; bottom: 40px; left: 0; right: 0;
    text-align: center; z-index: 10;
    transition: opacity 0.4s;
  }
  .bottom-hint.hidden { opacity: 0; pointer-events: none; }
  .hint-text {
    font-family: 'Space Mono', monospace;
    font-size: 9px; color: var(--gold);
    letter-spacing: 3px;
    animation: hintFade 3s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 0.7; }
  }

  .version {
    position: absolute; bottom: 12px; right: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 8px; color: rgba(26,26,26,0.15);
    letter-spacing: 2px; z-index: 10;
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>

<div class="floating-words" id="floatingWords"></div>
<div class="particles" id="particles"></div>

<!-- Drapeau langue -->
<div class="lang-btn" id="langBtn" onclick="toggleLang()">
  <div class="flag-fr"></div>
  <div class="flag-uk"></div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="bottom-btn" title="Règles">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
  </div>
  <div class="bottom-btn" title="Paramètres">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.04 7.04 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
  </div>
  <div class="bottom-btn" title="Note">
    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
  </div>
  <div class="bottom-btn" title="Cadeau">
    <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.99 2.99 0 0 0-5.5-1.65l-.5.67-.5-.68C11.02 3.01 10 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4a2 2 0 0 0-2 2v3a1 1 0 0 0 1 1h1v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7h1a1 1 0 0 0 1-1V8a2 2 0 0 0-2-2zm-5 2v12H9V8h6zm-7 0v12H4v-7H3V8h5zm0-3c0-.55.45-1 1-1s1 .45 1 1-.45 1-1 1-1-.45-1-1zm6-1c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm6 9v7h-4V8h5v7h1zm2-8h-5V8h5v3z"/></svg>
  </div>
</div>

<div class="title-area" id="titleArea">
  <div class="title-row" id="titleRow"></div>
  <div class="subtitle">TROUVEZ L'INTRUS PARMI VOUS</div>
</div>

<div class="safe-area" id="safeArea">
  <div class="safe-scene" id="safeScene" onclick="openSafe()">
    <div class="safe-pulse"></div>
    <div class="safe-pulse"></div>
    <div class="safe-pulse"></div>

    <!-- Corps du coffre -->
    <div class="safe">
      <div class="safe-rivet tl"></div>
      <div class="safe-rivet tr"></div>
      <div class="safe-rivet bl"></div>
      <div class="safe-rivet br"></div>

      <!-- Cadran au centre du coffre -->
      <div class="safe-dial">
        <div class="safe-dial-ring"></div>
        <div class="safe-dial-marks">
          <div class="safe-dial-mark" style="transform: rotate(0deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(30deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(60deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(90deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(120deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(150deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(180deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(210deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(240deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(270deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(300deg)"></div>
          <div class="safe-dial-mark" style="transform: rotate(330deg)"></div>
        </div>
        <div class="safe-dial-center">
          <div class="safe-dial-pointer"></div>
        </div>
      </div>

      <!-- Poignée sous le cadran -->
      <div class="safe-handle"></div>
    </div>
  </div>
</div>

<div class="bottom-hint" id="bottomHint">
  <div class="hint-text">TOURNEZ LE CADRAN POUR COMMENCER</div>
</div>

<div class="version">v1.0.9</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">CONFIGURATION</div>
    <div class="modal-section">
      <div class="modal-label">Nombre de joueurs</div>
      <div class="slider-row">
        <div class="slider-bar"><div class="slider-fill"></div></div>
        <div class="slider-val">3</div>
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-label">Mode de jeu</div>
      <div class="mode-grid">
        <div class="mode-card active">
          <div class="mode-card-emoji">🕵️</div>
          <div class="mode-card-title">UNDERCOVER</div>
          <div class="mode-card-desc">Intrus + Mister White</div>
        </div>
        <div class="mode-card">
          <div class="mode-card-emoji">🔍</div>
          <div class="mode-card-title">SPYFALL</div>
          <div class="mode-card-desc">1 espion, devinez</div>
        </div>
        <div class="mode-card">
          <div class="mode-card-emoji">🎭</div>
          <div class="mode-card-title">MIME</div>
          <div class="mode-card-desc">Mime des images</div>
        </div>
      </div>
    </div>
    <div class="launch-btn" onclick="closeModalDirect()">
      <div class="launch-btn-text">LANCER LA PARTIE</div>
    </div>
    <div class="close-btn" onclick="closeModalDirect()">
      <div class="close-btn-text">FERMER</div>
    </div>
  </div>
</div>

<script>
  // ─── TITLE ───
  const titleText = "MOTS SECRETS";
  const titleColors = ['#8B5E3C','#A0522D','#2E6B8A','#7B3F7B','#8B3A3A','#2E7B4F','#8B6914','#2E5F8B','#7B3F7B','#8B5E3C','#A0522D','#2E6B8A'];
  const titleRow = document.getElementById('titleRow');
  let colorIdx = 0;
  titleText.split('').forEach((char, i) => {
    if (char === ' ') {
      const space = document.createElement('span');
      space.className = 'title-space';
      titleRow.appendChild(space);
    } else {
      const span = document.createElement('span');
      span.className = 'title-letter';
      span.textContent = char;
      span.style.color = titleColors[colorIdx % titleColors.length];
      span.style.animationDelay = (i * 0.1) + 's';
      colorIdx++;
      titleRow.appendChild(span);
    }
  });

  // ─── FLOATING WORDS ───
  const words = [
    "MESSI","NEYMAR","BENZEMA","MBAPPÉ","ZIDANE",
    "PARIS","TOKYO","LONDRES","ROME","BERLIN",
    "AVENGERS","JEDI","X-MEN","AKATSUKI","SAIYAN",
    "PIANO","GUITARE","VIOLON","TROMPETTE",
    "TITANIC","INCEPTION","AVATAR","MATRIX",
    "CHAT","CHIEN","AIGLE","DAUPHIN","SERPENT",
    "FERRARI","LAMBORGHINI","BUGATTI",
    "NIKE","ADIDAS","APPLE","GOOGLE",
    "PLAGE","MONTAGNE","FORÊT","OCÉAN","VOLCAN"
  ];

  const container = document.getElementById('floatingWords');
  const floatingColors = [
    'rgba(26,26,26,0.30)',
    'rgba(139,90,43,0.30)',
    'rgba(43,90,139,0.30)',
    'rgba(110,43,110,0.30)',
    'rgba(139,43,43,0.30)',
    'rgba(43,110,60,0.30)',
  ];
  function spawnWord() {
    const el = document.createElement('div');
    el.className = 'floating-word';
    el.textContent = words[Math.floor(Math.random() * words.length)];
    const size = 14 + Math.random() * 28;
    const rotation = -15 + Math.random() * 30;
    el.style.fontSize = size + 'px';
    el.style.color = floatingColors[Math.floor(Math.random() * floatingColors.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.bottom = '-40px';
    el.style.setProperty('--word-rotate', rotation + 'deg');
    el.style.animationDuration = (12 + Math.random() * 20) + 's';
    el.style.animationDelay = '0s';
    container.appendChild(el);
    setTimeout(() => el.remove(), 35000);
  }
  for (let i = 0; i < 15; i++) setTimeout(() => spawnWord(), i * 800);
  setInterval(spawnWord, 2500);

  // ─── PARTICLES ───
  const particleContainer = document.getElementById('particles');
  function spawnParticle() {
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.left = Math.random() * 100 + '%';
    el.style.bottom = '0';
    const dur = 6 + Math.random() * 8;
    el.style.animationDuration = dur + 's';
    const size = 2 + Math.random() * 3;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    particleContainer.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000 + 500);
  }
  for (let i = 0; i < 8; i++) setTimeout(() => spawnParticle(), i * 400);
  setInterval(spawnParticle, 800);

  // ─── LANGUE ───
  function toggleLang() {
    document.getElementById('langBtn').classList.toggle('uk');
  }

  // ─── SAFE ───
  let isOpening = false;

  function openSafe() {
    if (isOpening) return;
    isOpening = true;

    // Le cadran tourne
    document.getElementById('safeScene').classList.add('turning');

    // Le coffre rétrécit + tout disparaît
    setTimeout(() => {
      document.getElementById('safeArea').classList.add('shrinking');
      document.getElementById('bottomBar').classList.add('hidden');
      document.getElementById('titleArea').classList.add('hidden');
      document.getElementById('bottomHint').classList.add('hidden');
    }, 2400);

    // Le modal sort
    setTimeout(() => {
      document.getElementById('modalOverlay').classList.add('visible');
    }, 2700);
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
  }

  function closeModalDirect() {
    document.getElementById('modalOverlay').classList.remove('visible');
    setTimeout(() => {
      document.getElementById('safeScene').classList.remove('turning');
      document.getElementById('safeArea').classList.remove('shrinking');
      document.getElementById('bottomBar').classList.remove('hidden');
      document.getElementById('titleArea').classList.remove('hidden');
      document.getElementById('bottomHint').classList.remove('hidden');
      isOpening = false;
    }, 400);
  }
</script>
</body>
</html>
