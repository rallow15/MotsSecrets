<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Feature Graphic</title></head>
<body style="margin:0;padding:0;background:#080808;">
  <div style="width:1024px;height:500px;position:relative;background:linear-gradient(135deg,#080808 0%,#1a1a1a 50%,#080808 100%);font-family:'Bebas Neue',sans-serif;overflow:hidden;">
    <!-- Background pattern -->
    <div style="position:absolute;inset:0;opacity:0.1;">
      <div style="position:absolute;top:20%;left:10%;width:200px;height:200px;border:3px solid #e8ff47;border-radius:50%;"></div>
      <div style="position:absolute;top:60%;right:15%;width:150px;height:150px;border:3px solid #e8ff47;border-radius:50%;"></div>
      <div style="position:absolute;top:40%;left:50%;width:100px;height:100px;background:#e8ff47;opacity:0.2;transform:rotate(45deg);"></div>
    </div>

    <!-- Main content centered -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
      <!-- Icon/Logo area -->
      <div style="display:flex;align-items:center;justify-content:center;gap:30px;margin-bottom:20px;">
        <div style="width:80px;height:80px;background:#e8ff47;border-radius:20px;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:50px;">🎮</span>
        </div>
        <h1 style="color:#e8ff47;font-size:72px;margin:0;letter-spacing:8px;">MOTS SECRETS</h1>
      </div>

      <!-- Tagline -->
      <p style="color:#ffffff;font-size:32px;margin:0;opacity:0.9;letter-spacing:4px;">DÉCOUVREZ L'INTRUS PARMI VOUS</p>

      <!-- Features -->
      <div style="display:flex;gap:40px;justify-content:center;margin-top:30px;">
        <span style="color:#ffffff;font-size:24px;opacity:0.7;">🎭 INTRUS</span>
        <span style="color:#e8ff47;font-size:24px;">•</span>
        <span style="color:#ffffff;font-size:24px;opacity:0.7;">🤵 MISTER WHITE</span>
        <span style="color:#e8ff47;font-size:24px;">•</span>
        <span style="color:#ffffff;font-size:24px;opacity:0.7;">3-20 JOUEURS</span>
      </div>
    </div>

    <!-- Corner accent -->
    <div style="position:absolute;bottom:0;right:0;width:200px;height:200px;background:linear-gradient(45deg,transparent 50%,#e8ff47 50%);opacity:0.3;"></div>
  </div>
</body>
</html>
