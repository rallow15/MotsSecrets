<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Developer Header</title></head>
<body style="margin:0;padding:0;background:#080808;">
  <div style="width:1200px;height:400px;position:relative;background:linear-gradient(90deg,#080808 0%,#1a1a1a 50%,#080808 100%);font-family:'Bebas Neue',sans-serif;overflow:hidden;">
    <!-- Background pattern -->
    <div style="position:absolute;inset:0;opacity:0.15;">
      <div style="position:absolute;top:10%;left:5%;width:100px;height:100px;border:2px solid #e8ff47;border-radius:50%;"></div>
      <div style="position:absolute;top:70%;left:15%;width:60px;height:60px;background:#e8ff47;opacity:0.3;transform:rotate(45deg);"></div>
      <div style="position:absolute;top:20%;right:10%;width:80px;height:80px;border:2px solid #e8ff47;border-radius:50%;"></div>
      <div style="position:absolute;top:60%;right:20%;width:50px;height:50px;background:#e8ff47;opacity:0.3;"></div>
    </div>

    <!-- Centered content -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
      <!-- Logo -->
      <div style="width:100px;height:100px;background:#e8ff47;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 10px 40px rgba(232,255,71,0.4);">
        <span style="font-size:60px;">🎮</span>
      </div>

      <!-- Developer name -->
      <h1 style="color:#e8ff47;font-size:56px;margin:0;letter-spacing:6px;">TONNOM</h1>

      <!-- Tagline -->
      <p style="color:#ffffff;font-size:24px;margin:10px 0 0 0;opacity:0.7;letter-spacing:3px;">DÉVELOPPEUR DE JEUX MOBILES</p>
    </div>

    <!-- Bottom accent line -->
    <div style="position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent 0%,#e8ff47 50%,transparent 100%);"></div>
  </div>
</body>
</html>
