<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mots Secrets - Test Menu Undercover</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        .phone {
            width: 375px;
            height: 812px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            /* VRAI FOND PNG SOUS-COUCHE */
            background: linear-gradient(180deg, #5DBDE8 0%, #3FA9F5 35%, #2196F3 100%);
            position: relative;
        }
        /* Cercles décoratifs */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }
        .c1 { width: 250px; height: 250px; top: -80px; left: -80px; }
        .c2 { width: 180px; height: 180px; bottom: 60px; right: -60px; }
        .content {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px 30px;
            position: relative;
            z-index: 2;
        }
        /* Boutons SVG en haut */
        .top-row { display: flex; gap: 12px; margin-bottom: 10px; }
        .icon-btn {
            width: 50px; height: 50px;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.35); }
        .icon-btn svg { width: 26px; height: 26px; fill: #fff; }
        /* Logo */
        .logo {
            font-family: 'Arial Black', sans-serif;
            font-size: 48px;
            color: #fff;
            text-align: center;
            line-height: 1;
            text-shadow: 0 3px 6px rgba(0,0,0,0.25);
        }
        .subtitle {
            font-size: 10px;
            color: rgba(255,255,255,0.85);
            letter-spacing: 4px;
            margin-top: 5px;
            text-transform: uppercase;
        }
        /* Mascotte */
        .mascot {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: linear-gradient(145deg, #FFD54F, #FFB300);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 10px 0;
            box-shadow: 0 0 0 5px rgba(255,255,255,0.25);
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        /* Bouton JOUER */
        .play-btn {
            width: 200px; height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #66BB6A, #43A047);
            border: 6px solid rgba(255,255,255,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .play-icon { font-size: 60px; }
        .play-text {
            font-family: 'Arial Black', sans-serif;
            font-size: 28px;
            color: #fff;
            margin-top: 5px;
        }
        /* Boutons secondaires */
        .secondary-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .secondary-btn {
            padding: 12px 16px;
            border-radius: 50px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.35);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .emoji { font-size: 22px; }
        .coming-soon {
            position: absolute;
            right: 15px;
            background: rgba(255,255,255,0.25);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 8px;
            color: #fff;
        }
        .btn-wrap { position: relative; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="circle c1"></div>

                </button>
            </div>

            <!-- Logo -->
            <h1 class="logo">MOTS<br>SECRETS</h1>
            <p class="subtitle">Le jeu d'ambiance</p>

            <!-- Mascotte -->
            <div class="mascot">🕵️</div>

            <!-- Bouton JOUER -->
            <button class="play-btn">
                <span class="play-icon">🎮</span>
                <span class="play-text">JOUER</span>
            </button>

            <!-- Boutons secondaires -->
            <div class="secondary-btns">
                <div class="btn-wrap">
                    <button class="secondary-btn">
                        <span class="emoji">👥</span> Mode Local
                    </button>
                </div>
                <div class="btn-wrap">
                    <button class="secondary-btn">
                        <span class="emoji">🌐</span> Mode En Ligne
                    </button>
                    <span class="coming-soon">Bientôt</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
