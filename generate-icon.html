<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>App Icon</title></head>
<body style="margin:0;padding:0;background:#080808;">
  <div style="width:512px;height:512px;position:relative;background:linear-gradient(135deg,#080808 0%,#1a1a1a 100%);font-family:'Bebas Neue',sans-serif;display:flex;align-items:center;justify-content:center;">
    <!-- Background accent -->
    <div style="position:absolute;inset:20px;border:3px solid #e8ff47;opacity:0.3;"></div>

    <!-- Main content -->
    <div style="text-align:center;">
      <!-- Game controller emoji -->
      <div style="width:200px;height:200px;background:#e8ff47;border-radius:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 10px 40px rgba(232,255,71,0.3);">
        <span style="font-size:120px;">🎮</span>
      </div>

      <!-- Text -->
      <div style="color:#e8ff47;font-size:36px;letter-spacing:4px;">MOTS</div>
      <div style="color:#e8ff47;font-size:36px;letter-spacing:4px;">SECRETS</div>
    </div>

    <!-- Corner decorations -->
    <div style="position:absolute;top:40px;left:40px;width:30px;height:30px;background:#e8ff47;opacity:0.5;"></div>
    <div style="position:absolute;bottom:40px;right:40px;width:30px;height:30px;background:#e8ff47;opacity:0.5;"></div>
  </div>
</body>
</html>
