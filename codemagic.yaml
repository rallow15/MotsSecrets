workflows:

  # ── ANDROID APK (test / sideload) ──────────────────────────
  android-apk:
    name: Android APK
    max_build_duration: 60
    environment:
      java: 17
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo prebuild Android
        script: npx expo prebuild --platform android --clean
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

  # ── ANDROID AAB (Play Store) ────────────────────────────────
  android-aab:
    name: Android AAB (Play Store)
    max_build_duration: 60
    environment:
      java: 17
      node: latest
      android_signing:
        - mots_secrets_keystore
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo prebuild Android
        script: npx expo prebuild --platform android --clean
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
      
  # ── iOS IPA (sans signature) ────────────────────────────────
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: latest
      vars:
        BUNDLE_ID: "com.tonnom.motssecrets"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo prebuild iOS
        script: npx expo prebuild --platform ios --clean
      - name: Set Pod deployment target
        script: |
          cd ios
          pod install
      - name: Build IPA (unsigned with frameworks)
        script: |
          # Build archive
          xcodebuild -workspace ios/MotsSecrets.xcworkspace \
            -scheme MotsSecrets \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/MotsSecrets.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ENABLE_BITCODE=NO

          # Verify the .app exists in the archive
          APP_PATH=$(find "$CM_BUILD_DIR/MotsSecrets.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive!"
            ls -la "$CM_BUILD_DIR/MotsSecrets.xcarchive/Products/Applications/" || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          echo "App size: $(du -sh "$APP_PATH" | cut -f1)"

          # Create IPA
          mkdir -p $CM_BUILD_DIR/ipa/Payload
          cp -r "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"

          # Remove code signature (since we're unsigned)
          rm -rf "$CM_BUILD_DIR/ipa/Payload/"*.app/_CodeSignature 2>/dev/null || true

          cd $CM_BUILD_DIR/ipa
          zip --symlinks -r MotsSecrets.ipa Payload
          echo "IPA size: $(du -sh MotsSecrets.ipa | cut -f1)"
    artifacts:
      - $CM_BUILD_DIR/ipa/MotsSecrets.ipa
