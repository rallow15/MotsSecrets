<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Menu Undercover - Mots Secrets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
        }

        .phone {
            width: 375px;
            height: 812px;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            /* Fond bleu style Undercover */
            background: linear-gradient(180deg, #5DBDE8 0%, #3FA9F5 35%, #2196F3 100%);
        }

        /* Cercles décoratifs */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
        }
        .circle-1 {
            width: 280px;
            height: 280px;
            top: -100px;
            left: -100px;
        }
        .circle-2 {
            width: 200px;
            height: 200px;
            bottom: 80px;
            right: -80px;
        }
        .circle-3 {
            width: 100px;
            height: 100px;
            top: 35%;
            left: 70%;
            background: rgba(255,255,255,0.08);
        }

        .content {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 24px 40px;
            position: relative;
            z-index: 2;
        }

        /* Top buttons - Icônes SVG */
        .top-row {
            display: flex;
            gap: 14px;
            margin-bottom: 15px;
        }

        .icon-btn {
            width: 52px;
            height: 52px;
            border-radius: 26px;
            background: rgba(255,255,255,0.22);
            border: 2px solid rgba(255,255,255,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.08);
        }

        .icon-btn svg {
            width: 28px;
            height: 28px;
        }

        /* Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 5px;
        }

        .logo {
            font-family: 'Arial Black', sans-serif;
            font-size: 50px;
            color: #fff;
            text-align: center;
            text-shadow:
                0 3px 6px rgba(0,0,0,0.25),
                0 0 20px rgba(255,255,255,0.2);
            line-height: 0.95;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 10px;
            color: rgba(255,255,255,0.85);
            letter-spacing: 4px;
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* Mascotte - Espion */
        .mascot-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(145deg, #FFD54F, #FFB300);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 0;
            box-shadow:
                0 8px 20px rgba(0,0,0,0.2),
                0 0 0 5px rgba(255,255,255,0.25);
            animation: bounce 1.5s ease-in-out infinite;
        }

        .mascot {
            font-size: 55px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Gros bouton JOUER */
        .play-container {
            margin: 10px 0;
        }

        .play-btn {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: linear-gradient(145deg, #66BB6A, #43A047);
            border: 7px solid rgba(255,255,255,0.28);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 12px 35px rgba(0,0,0,0.3),
                inset 0 -8px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 12px 35px rgba(0,0,0,0.3), inset 0 -8px 20px rgba(0,0,0,0.15);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 18px 45px rgba(0,0,0,0.35), inset 0 -8px 20px rgba(0,0,0,0.15);
            }
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .play-icon {
            font-size: 65px;
            margin-bottom: 5px;
        }

        .play-text {
            font-family: 'Arial Black', sans-serif;
            font-size: 30px;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Paramètres rapides */
        .quick-settings {
            display: flex;
            gap: 10px;
            margin: 12px 0;
        }

        .pill {
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.18);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(6px);
        }

        /* Boutons secondaires */
        .secondary-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 8px;
        }

        .secondary-btn {
            padding: 13px 18px;
            border-radius: 50px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.35);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .secondary-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .secondary-btn .emoji {
            font-size: 22px;
        }

        .coming-soon {
            position: absolute;
            right: 16px;
            background: rgba(255,255,255,0.25);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 8px;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-wrapper {
            position: relative;
        }

        /* Label en bas */
        .label {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="phone">
        <!-- Cercles décoratifs -->
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
        <div class="bg-circle circle-3"></div>

        <div class="content">
            <!-- Boutons du haut avec SVG -->
            <div class="top-row">
                <button class="icon-btn" title="Règles">

                    <span style="font-size:24px">🇬🇧</span>
                </button>

                    </svg>
                </button>
            </div>

            <!-- Logo -->
            <div class="logo-container">
                <h1 class="logo">MOTS<br>SECRETS</h1>
                <p class="subtitle">Le jeu d'ambiance</p>
            </div>

            <!-- Mascotte -->
            <div class="mascot-container">
                <div class="mascot">🕵️</div>
            </div>

            <!-- Bouton JOUER -->
            <div class="play-container">
                <button class="play-btn">
                    <span class="play-icon">🎮</span>
                    <span class="play-text">JOUER</span>
                </button>
            </div>

            <!-- Paramètres rapides -->
            <div class="quick-settings">
                <div class="pill">👥 3-20 joueurs</div>
                <div class="pill">🎲 Aléatoire</div>
            </div>

            <!-- Boutons secondaires -->
            <div class="secondary-btns">
                <div class="btn-wrapper">
                    <button class="secondary-btn">
                        <span class="emoji">👥</span>
                        Mode Local
                    </button>
                </div>
                <div class="btn-wrapper">
                    <button class="secondary-btn">
                        <span class="emoji">🌐</span>
                        Mode En Ligne
                    </button>
                    <span class="coming-soon">Bientôt</span>
                </div>
            </div>
        </div>

        <div class="label">Test avec fond style Undercover</div>
    </div>
</body>
</html>
